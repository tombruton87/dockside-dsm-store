name: Package source

# Hourly, the feed is rebuilt from each package's latest release; a new release
# shows up in Package Center within the hour. Run it by hand after a release to
# skip the wait. site/ is published to GitHub Pages (and to Cloudflare as well,
# if its secrets are set).
on:
  schedule: [{ cron: "17 * * * *" }]
  workflow_dispatch:
  push:
    branches: [main]
    paths: [build.py, repos.txt, config.json, templates/**, site/art/**, worker/**, wrangler.jsonc, .github/workflows/**]

permissions: { contents: write, pages: write, id-token: write }
concurrency: { group: package-source }

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.commit.outputs.changed == 'true' || github.event_name != 'schedule' }}
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site/ from the latest releases
        id: build
        run: python3 build.py
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        continue-on-error: true   # a failed lookup keeps that package's last good entry; the rest still ships

      - name: Commit what changed
        id: commit
        run: |
          git add -A site cache.json
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Package source: $(jq -r 'to_entries | map("\(.key) \(.value.tag)") | join(", ")' site/meta.json)"
          git pull -q --rebase origin main   # another run may have pushed first
          git push -q
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Package site/ for GitHub Pages
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v3
        with: { path: site }

      - name: Deploy to Cloudflare
        if: env.HAS_CLOUDFLARE == 'true' && (steps.commit.outputs.changed == 'true' || github.event_name != 'schedule')
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Fail if a package could not be read
        if: steps.build.outcome == 'failure'
        run: exit 1

  pages:
    needs: build
    if: always() && needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
